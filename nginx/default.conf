server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Astro builds every page as <name>/index.html, so requests without a
    # trailing slash get redirected. Keep those redirects relative, so the
    # scheme, host and port of the original request are preserved.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }
}
