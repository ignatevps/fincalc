server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Astro builds every page as <name>/index.html, so requests without a
    # trailing slash get redirected. Keep those redirects relative, so the
    # scheme, host and port of the original request are preserved.
    absolute_redirect off;

    # The pages carry a few dozen kilobytes of prose, and it compresses to
    # roughly a quarter of that. HTML is always included when gzip is on.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Astro fingerprints these filenames, so a given name never changes its
    # contents — they can be kept for a year without ever revalidating.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;

        # A deploy replaces the page under the same address, so the browser has
        # to ask before reusing it. "no-cache" does not forbid caching — it
        # requires revalidation, and the ETag turns that into a cheap 304.
        add_header Cache-Control "no-cache";
    }
}
